name: Welcome Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome message
        uses: actions/github-script@v7
        with:
          script: |
            const issueOrPr = context.payload.issue || context.payload.pull_request;

            const message =
              "👋 Hello @" + issueOrPr.user.login + "!\n\n" +
              "Thanks for opening this " +
              (context.eventName === "issues" ? "issue" : "pull request") +
              " in WebTechnology-II 🚀\n\n" +
              "Please make sure:\n" +
              "- Your code follows project structure\n" +
              "- You tested your changes\n" +
              "- You clearly describe what you did\n\n" +
              "Happy coding! 💻🔥";

            const number = context.payload.issue
              ? context.payload.issue.number
              : context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: message
            });